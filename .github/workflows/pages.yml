# Publishes the project website (docs/ plus CHANGES.md) to GitHub Pages.
name: Website

on:
  push:
    branches: [main]
    paths: ["docs/**", "CHANGES.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Put the site together
        run: |
          mkdir _site
          cp -R docs/. _site/
          cp CHANGES.md _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
